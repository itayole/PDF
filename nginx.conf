server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA: always serve index.html for unknown paths.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # nginx's default mime.types has no .mjs entry, so it would serve the
    # pdf.js ES module worker as application/octet-stream — which browsers
    # reject for module workers. Force a JavaScript MIME type for .mjs.
    # (Regex location takes precedence over the /assets/ prefix below.)
    location ~ \.mjs$ {
        types { }
        default_type application/javascript;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Long-cache the hashed build assets.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/css application/javascript application/wasm;
    gzip_min_length 1024;

    # pdf.js needs its worker; allow it to load. No external calls are made.
    client_max_body_size 0;
}
